<!DOCTYPE html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LaLe</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span class="bm-f">la</span>
          <span class="bm-sep"></span>
          <span class="bm-m">le</span>
        </div>
        <span class="brand-name">LaLe</span>
      </div>
      <div class="topbar-right">
        <button id="hover-toggle" class="hover-pill" aria-label="Toggle hover tooltip" title="Hover tooltip on/off">
          <span class="hp-led" aria-hidden="true"></span>
          <span class="hp-text">Hover</span>
        </button>
        <span class="lang-badge">FR</span>
      </div>
    </header>

    <section class="search">
      <div class="input-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input
          id="word-input"
          type="text"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          placeholder="Search a French word…"
          aria-label="Word to look up"
        />
        <button id="clear-btn" class="icon-btn" title="Clear" aria-label="Clear">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <ul id="suggestions" class="suggestions" hidden></ul>
    </section>

    <main id="result" class="result"></main>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab is-active" data-tab="recent" role="tab">Recent</button>
      <button class="tab" data-tab="favorites" role="tab">Favorites</button>
    </nav>
    <section id="list" class="list"></section>

    <footer class="footer">
      <button id="open-options" class="link-btn">Settings</button>
      <span class="footer-ver">v0.2</span>
    </footer>

    <!-- ── Templates ───────────────────────────────────── -->

    <template id="tpl-empty">
      <div class="empty">
        <div class="empty-brand" aria-hidden="true">
          <span class="eb-f">la</span>
          <span class="eb-dot">·</span>
          <span class="eb-m">le</span>
        </div>
        <p class="empty-title">French word gender, instantly.</p>
        <p class="empty-sub">Try&nbsp;
          <button class="chip" data-try="maison">maison</button>
          <button class="chip" data-try="soleil">soleil</button>
          <button class="chip" data-try="liberté">liberté</button>
        </p>
      </div>
    </template>

    <template id="tpl-result">
      <div class="card">
        <div class="card-top">
          <div class="gender-banner">
            <span class="gender-pill"></span>
            <span class="gender-label"></span>
          </div>
          <div class="card-actions">
            <span class="src-badge" hidden>Wikt.</span>
            <button class="fav-btn icon-btn" title="Save to favorites" aria-label="Save to favorites">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path class="fav-path" d="M12 2.5l3 6.5 7 .9-5 4.8 1.3 7L12 18.3 5.7 21.7 7 14.7 2 9.9l7-.9z"
                      fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="article-line">
          <span class="article"></span>
          <span class="word"></span>
        </div>
        <div class="word-meta">
          <span class="translation"></span>
          <span class="plural-chip"><span class="plural-label">pl.</span>&nbsp;<span class="plural"></span></span>
        </div>
        <div class="example-row">
          <span class="detail-label">Example</span>
          <span class="detail-value example"></span>
        </div>
      </div>
    </template>

    <template id="tpl-not-found">
      <div class="card not-found">
        <div class="nf-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" width="20" height="20">
            <circle cx="12" cy="12" r="9"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>
        <p class="nf-title">Not found</p>
        <p class="nf-sub">Did you mean:</p>
        <div class="suggest-row"></div>
        <p class="nf-wiki">Searching Wiktionary…</p>
      </div>
    </template>

    <script type="module" src="popup.js"></script>
  </body>
</html>
