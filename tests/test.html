<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gendly — Test Suite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: #0f0f13; color: #e2e8f0; padding: 32px; font-size: 14px; }
    h1   { font-size: 22px; margin-bottom: 4px; color: #f8fafc; }
    .sub { color: #64748b; margin-bottom: 28px; font-size: 13px; }
    #summary { display: flex; gap: 20px; margin-bottom: 28px; }
    .stat { background: #1e1b2e; border-radius: 10px; padding: 16px 24px; min-width: 110px; }
    .stat .n { font-size: 28px; font-weight: 800; }
    .stat .l { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #64748b; margin-top: 2px; }
    .pass .n { color: #22c55e; }
    .fail .n { color: #ef4444; }
    .skip .n { color: #f59e0b; }
    #results { display: flex; flex-direction: column; gap: 6px; }
    .row { display: flex; align-items: flex-start; gap: 12px; background: #1e1b2e;
           border-radius: 8px; padding: 12px 16px; border-left: 3px solid transparent; }
    .row.ok  { border-color: #22c55e; }
    .row.err { border-color: #ef4444; }
    .row.skip{ border-color: #f59e0b; }
    .badge { font-size: 11px; font-weight: 700; letter-spacing: .06em;
             padding: 2px 8px; border-radius: 4px; flex-shrink: 0; margin-top: 1px; }
    .row.ok   .badge { background: #14532d; color: #22c55e; }
    .row.err  .badge { background: #450a0a; color: #ef4444; }
    .row.skip .badge { background: #451a03; color: #f59e0b; }
    .name { font-weight: 600; color: #f1f5f9; flex: 1; }
    .detail { font-size: 12px; color: #94a3b8; margin-top: 3px; }
    .detail.fail { color: #fca5a5; }
    h2 { margin: 24px 0 10px; font-size: 13px; text-transform: uppercase;
         letter-spacing: .08em; color: #475569; }
  </style>
</head>
<body>
  <h1>Gendly Test Suite</h1>
  <p class="sub">Run this page from inside the extension (e.g. chrome-extension://…/tests/test.html)</p>
  <div id="summary">
    <div class="stat pass"><div class="n" id="s-pass">—</div><div class="l">Passed</div></div>
    <div class="stat fail"><div class="n" id="s-fail">—</div><div class="l">Failed</div></div>
    <div class="stat skip"><div class="n" id="s-skip">—</div><div class="l">Skipped</div></div>
  </div>
  <div id="results"></div>

<script type="module">
import { lookup, suggest } from "../src/lib/lookup.js";
import { getSettings, setSettings } from "../src/lib/storage.js";

// ── tiny test harness ─────────────────────────────────
const results = [];

async function test(name, fn) {
  try {
    await fn({
      expect(val, label) {
        if (!val) throw new Error(label || `Expected truthy, got ${JSON.stringify(val)}`);
      },
      eq(a, b, label) {
        if (a !== b) throw new Error(label || `Expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`);
      }
    });
    results.push({ name, ok: true });
  } catch (e) {
    results.push({ name, ok: false, msg: e.message });
  }
}

function skip(name, _reason) {
  results.push({ name, ok: "skip", msg: _reason });
}

// ── tests ─────────────────────────────────────────────

// 1. Local dictionary — masculine noun
await test("Local hit: 'maison' → feminine", async ({ eq }) => {
  const r = await lookup("maison");
  eq(r.ok, true, "result.ok should be true");
  eq(r.gender, "f", "gender should be f");
  eq(r.article, "la", "article should be la");
  eq(r.src, "local", "source should be local");
});

// 2. Local dictionary — masculine noun
await test("Local hit: 'soleil' → masculine", async ({ eq }) => {
  const r = await lookup("soleil");
  eq(r.ok, true);
  eq(r.gender, "m");
  eq(r.article, "le");
});

// 3. Article elision — vowel-initial word
await test("Elision: 'arbre' → l'arbre", async ({ eq }) => {
  const r = await lookup("arbre");
  eq(r.ok, true);
  eq(r.article, "l'", "vowel-initial masc word should use l'");
});

// 4. Elision — feminine vowel-initial
await test("Elision: 'eau' → l'eau (feminine)", async ({ eq }) => {
  const r = await lookup("eau");
  eq(r.ok, true);
  eq(r.gender, "f");
  eq(r.article, "l'");
});

// 5. Article stripping — user types "la maison"
await test("Normalization: 'la maison' strips article", async ({ eq }) => {
  const r = await lookup("la maison");
  eq(r.ok, true);
  eq(r.word, "maison");
});

// 6. Article stripping — "le soleil"
await test("Normalization: 'le soleil' strips article", async ({ eq }) => {
  const r = await lookup("le soleil");
  eq(r.ok, true);
  eq(r.word, "soleil");
});

// 7. Article stripping — "l'arbre"
await test("Normalization: \"l'arbre\" strips article", async ({ eq }) => {
  const r = await lookup("l'arbre");
  eq(r.ok, true);
  eq(r.word, "arbre");
});

// 8. Case insensitivity
await test("Case: 'MAISON' returns result", async ({ eq }) => {
  const r = await lookup("MAISON");
  eq(r.ok, true);
  eq(r.gender, "f");
});

// 9. Not found (short word)
await test("Short word: 'a' returns not-found", async ({ eq }) => {
  const r = await lookup("a");
  eq(r.ok, false);
});

// 10. Not found (nonexistent word)
await test("Unknown word: 'xyzqwerty' returns not-found or wiki-miss", async ({ expect }) => {
  const r = await lookup("xyzqwerty");
  expect(!r.ok || r.src === "wiki", "should be not-found or wiki result");
});

// 11. Suggest autocomplete
await test("Suggest: 'ma' returns matches starting with ma", async ({ expect }) => {
  const items = await suggest("ma");
  expect(items.length > 0, "should return suggestions");
  expect(items.every(w => w.startsWith("ma")), "all items should start with ma");
});

// 12. Suggest: 'lib' matches 'liberté'
await test("Suggest: 'lib' includes 'liberté'", async ({ expect }) => {
  const items = await suggest("lib");
  expect(items.includes("liberté"), `got: ${items.join(", ")}`);
});

// 13. Settings — read defaults
await test("Settings: hoverEnabled defaults to true", async ({ expect }) => {
  const s = await getSettings();
  expect(s.hoverEnabled !== false, "hoverEnabled should default to true");
});

// 14. Settings — round-trip write/read
await test("Settings: theme round-trip", async ({ eq }) => {
  await setSettings({ theme: "dark" });
  const s = await getSettings();
  eq(s.theme, "dark");
  await setSettings({ theme: "auto" }); // restore
});

// 15. Common words coverage — top 20 nouns
const top20 = ["homme", "femme", "enfant", "jour", "an", "vie", "monde",
               "temps", "main", "yeux", "eau", "terre", "père", "mère",
               "ville", "pays", "heure", "nuit", "soleil", "voiture"];
for (const w of top20) {
  await test(`Coverage: '${w}' found locally`, async ({ eq }) => {
    const r = await lookup(w);
    // Accept local OR wiki hit — just not a complete miss for these common words
    if (!r.ok) throw new Error(`'${w}' not found anywhere`);
  });
}

// 16. Wiktionary fallback (live network) — skipped if offline
skip("Wiktionary: 'baleine' found via API", "Requires live network — test manually in extension");

// ── render ─────────────────────────────────────────────
const passed = results.filter(r => r.ok === true).length;
const failed = results.filter(r => r.ok === false).length;
const skipped = results.filter(r => r.ok === "skip").length;

document.getElementById("s-pass").textContent = passed;
document.getElementById("s-fail").textContent = failed;
document.getElementById("s-skip").textContent = skipped;

const container = document.getElementById("results");

// group by category
const groups = {};
for (const r of results) {
  const g = r.name.split(":")[0];
  if (!groups[g]) groups[g] = [];
  groups[g].push(r);
}

for (const [group, items] of Object.entries(groups)) {
  const h = document.createElement("h2");
  h.textContent = group;
  container.appendChild(h);
  for (const r of items) {
    const cls = r.ok === true ? "ok" : r.ok === "skip" ? "skip" : "err";
    const badge = r.ok === true ? "PASS" : r.ok === "skip" ? "SKIP" : "FAIL";
    const div = document.createElement("div");
    div.className = `row ${cls}`;
    div.innerHTML = `
      <span class="badge">${badge}</span>
      <div>
        <div class="name">${r.name}</div>
        ${r.msg ? `<div class="detail ${cls === "err" ? "fail" : ""}">${r.msg}</div>` : ""}
      </div>`;
    container.appendChild(div);
  }
}
</script>
</body>
</html>
