<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background — deep near-black -->
  <rect width="128" height="128" rx="28" fill="#09090e"/>

  <!-- Subtle diagonal separator -->
  <line x1="10" y1="118" x2="118" y2="10"
        stroke="#252545" stroke-width="1.5" stroke-linecap="round"/>

  <!-- "la" — feminine rose, upper-left -->
  <text x="14" y="62"
        font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="44" letter-spacing="-2"
        fill="#e0507a">la</text>

  <!-- "le" — masculine amber/gold, lower-right -->
  <text x="60" y="110"
        font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="44" letter-spacing="-2"
        fill="#d4920a">le</text>
</svg>
